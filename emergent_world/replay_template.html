<title>Emergent World Replay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a field-station log. The map is the specimen on the left; the followed
   person's record sits beside it, and stacks below the map on a phone. */
:root {
  --bg: #eceee8;
  --surface: #f7f8f4;
  --ink: #1c231e;
  --muted: #5d685f;
  --line: #d3d8cf;
  --accent: #b97b0e;
  --accent-soft: #f3e3c2;
  --energy: #c8911f;
  --water: #3a78c2;
  --health: #3f9a5a;
  --danger: #b84a3a;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111511; --surface: #191f1a; --ink: #e2e8e0; --muted: #8f9a90; --line: #2b332c;
    --accent: #e2a73c; --accent-soft: #3a2e17; --energy: #d9a43a; --water: #5e9be0;
    --health: #5cb877; --danger: #e07562; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111511; --surface: #191f1a; --ink: #e2e8e0; --muted: #8f9a90; --line: #2b332c;
  --accent: #e2a73c; --accent-soft: #3a2e17; --energy: #d9a43a; --water: #5e9be0;
  --health: #5cb877; --danger: #e07562; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 18px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(24px, 4vw, 32px); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; }
.clock { font-family: var(--mono); font-size: 15px; font-variant-numeric: tabular-nums; }
.main { display: grid; grid-template-columns: minmax(0, 640px) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } }
.stage { display: grid; gap: 10px; min-width: 0; }
canvas { width: 100%; max-width: 100%; aspect-ratio: 1; display: block; image-rendering: pixelated; border-radius: 4px; cursor: pointer; background: #22341e; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
button, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button:hover, select:hover { border-color: var(--muted); }
button:focus-visible, select:focus-visible, input:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#play { min-width: 84px; font-weight: 700; }
input[type=range] { flex: 1 1 200px; accent-color: var(--accent); min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
.ring { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--accent); display: inline-block; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: grid; gap: 16px; min-width: 0; }
.who { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.who h2 { font-family: var(--display); font-weight: 600; font-size: 26px; margin: 0; color: var(--accent); }
.status { font-size: 14px; color: var(--muted); }
.status.dead { color: var(--danger); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fact { display: grid; gap: 2px; }
.fact b { font-family: var(--mono); font-weight: 500; font-size: 17px; font-variant-numeric: tabular-nums; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 64px minmax(0, 1fr) 40px; align-items: center; gap: 8px; font-size: 13px; }
.track { height: 9px; background: var(--line); border-radius: 5px; overflow: hidden; }
.fill { height: 100%; border-radius: 5px; transition: width 0.15s linear; }
.bar span:last-child { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.family { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font-family: var(--mono); font-size: 13px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.chip.gone { color: var(--muted); text-decoration: line-through; }
.chip.on { border-color: var(--accent); background: var(--accent-soft); }
.auto { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.story { display: grid; gap: 0; max-height: 380px; overflow-y: auto; border-top: 1px solid var(--line); }
.story div { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.story time { font-family: var(--mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 1px; }
.story p { margin: 0; }
.story .sick { color: var(--danger); }
.people { display: grid; gap: 8px; }
.people .list { display: flex; flex-wrap: wrap; gap: 6px; }
.empty { color: var(--muted); font-style: italic; }
@media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Emergent World Replay</h1>
      <p class="sub" id="sub">A recorded run. Click anyone on the map to follow their life.</p>
    </div>
    <div class="clock" id="clock">Year 1, day 1</div>
  </header>

  <div class="main">
    <section class="stage">
      <canvas id="map" width="640" height="640" aria-label="Map of the world: ponds, plants and people"></canvas>
      <div class="controls">
        <button id="play" type="button">Play</button>
        <select id="speed" aria-label="Playback speed">
          <option value="4">1 day / sec</option>
          <option value="28" selected>1 week / sec</option>
          <option value="120">1 month / sec</option>
        </select>
        <input id="scrub" type="range" min="0" value="0" aria-label="Time">
      </div>
      <div class="legend">
        <span><i class="sw" id="sw-food"></i>green plant</span>
        <span><i class="sw" id="sw-poison"></i>yellow-green plant (makes people sick)</span>
        <span><i class="sw" style="background:#28609f"></i>pond</span>
        <span><i class="ring"></i>followed, and how far they see</span>
      </div>
      <div class="people">
        <span class="label">Alive now</span>
        <div class="list" id="people"></div>
      </div>
    </section>

    <aside class="panel" aria-live="polite">
      <div class="who">
        <h2 id="who">#0</h2>
        <span class="status" id="status"></span>
      </div>
      <div class="facts">
        <div class="fact"><span class="label">Age</span><b id="age">0 days</b></div>
        <div class="fact"><span class="label">Generation</span><b id="gen">0</b></div>
        <div class="fact"><span class="label">Children</span><b id="kids">0</b></div>
      </div>
      <div class="bars" id="bars"></div>
      <div class="family">
        <span class="label">Family</span>
        <span id="family" class="family"></span>
      </div>
      <label class="auto"><input type="checkbox" id="auto" checked> Follow automatically (moves to a child when someone dies)</label>
      <div>
        <div class="label" style="margin-bottom:6px">Life so far, latest first</div>
        <div class="story" id="story"></div>
      </div>
    </aside>
  </div>
</div>

<script>
const DATA = /*REPLAY_DATA*/null;
(function () {
  const W = DATA.width, H = DATA.height, F = DATA.frameEvery, TPD = DATA.ticksPerDay;
  const people = DATA.people;
  const frames = DATA.frames;
  const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
  const PLANT = { 1: rgb(DATA.colors.food), 2: rgb(DATA.colors.poison) };
  const GRASS = "#22341e", WATER = "#28609f";
  document.getElementById("sw-food").style.background = PLANT[1];
  document.getElementById("sw-poison").style.background = PLANT[2];

  const canvas = document.getElementById("map"), ctx = canvas.getContext("2d");
  const scrub = document.getElementById("scrub");
  scrub.max = frames.length - 1;

  let frame = 0, playing = false, followed = frames[0][0], auto = true;

  // ---- time helpers (1 tick = 1 hour) ----
  const tickOf = i => i * F;
  const when = t => {
    const day = Math.floor(t / TPD);
    return `Year ${Math.floor(day / 365) + 1}, day ${day % 365 + 1}`;
  };
  const stamp = t => {
    const day = Math.floor(t / TPD);
    return `y${Math.floor(day / 365) + 1} d${day % 365 + 1}`;
  };

  // ---- plants: full map every few days, daily changes in between ----
  let plants = null, plantsDay = -1;
  function plantsOn(day) {
    if (day === plantsDay) return plants;
    const K = DATA.keyframeDays;
    let start = Math.floor(day / K) * K;
    while (!(start in DATA.keyframes) && start > 0) start -= K;
    if (plants && plantsDay >= start && plantsDay < day) {
      start = plantsDay;              // keep going forward from where we are
    } else {
      plants = Uint8Array.from(DATA.keyframes[start], ch => ch.charCodeAt(0) - 48);
    }
    for (let d = start + 1; d <= day && d - 1 < DATA.plantChanges.length; d++) {
      if (d in DATA.keyframes) { plants = Uint8Array.from(DATA.keyframes[d], ch => ch.charCodeAt(0) - 48); continue; }
      const ch = DATA.plantChanges[d - 1];
      for (let k = 0; k < ch.length; k += 2) plants[ch[k]] = ch[k + 1];
    }
    plantsDay = day;
    return plants;
  }

  const terrain = Uint8Array.from(DATA.terrain, ch => ch.charCodeAt(0) - 48);

  function agentsAt(i) {
    const flat = frames[i][1], out = [];
    for (let k = 0; k < flat.length; k += 6) {
      out.push({ id: flat[k], x: flat[k + 1], y: flat[k + 2], energy: flat[k + 3], water: flat[k + 4], health: flat[k + 5] });
    }
    return out;
  }

  // ---- drawing ----
  function draw() {
    const t = tickOf(frame);
    const size = canvas.width, cell = size / W;
    const p = plantsOn(Math.floor(t / TPD));
    ctx.fillStyle = GRASS;
    ctx.fillRect(0, 0, size, size);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x;
      if (terrain[i] === 1) { ctx.fillStyle = WATER; ctx.fillRect(x * cell, y * cell, cell + 0.5, cell + 0.5); }
      else if (p[i]) { ctx.fillStyle = PLANT[p[i]]; ctx.fillRect(x * cell + cell * 0.2, y * cell + cell * 0.2, cell * 0.6, cell * 0.6); }
    }
    const agents = agentsAt(frame);
    for (const a of agents) {
      const s = Math.max(0, Math.min(1, a.health / 100));
      ctx.fillStyle = `rgb(255,${Math.round(80 + 175 * s)},${Math.round(80 + 175 * s)})`;
      ctx.beginPath(); ctx.arc((a.x + 0.5) * cell, (a.y + 0.5) * cell, cell * 0.45, 0, Math.PI * 2); ctx.fill();
    }
    const f = agents.find(a => a.id === followed);
    if (f) {
      const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#e2a73c";
      ctx.strokeStyle = accent; ctx.lineWidth = Math.max(2, cell * 0.22);
      ctx.beginPath(); ctx.arc((f.x + 0.5) * cell, (f.y + 0.5) * cell, cell * 1.1, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 1; ctx.globalAlpha = 0.6;
      ctx.beginPath(); ctx.arc((f.x + 0.5) * cell, (f.y + 0.5) * cell, cell * 8, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    return agents;
  }

  // ---- the panel ----
  const el = id => document.getElementById(id);
  function chip(id, t, extra) {
    const b = document.createElement("button");
    const p = people[id];
    const alive = p && p.born <= t && (p.died === null || t < p.died);
    b.className = "chip" + (alive ? "" : " gone") + (id === followed ? " on" : "") + (extra ? " " + extra : "");
    b.type = "button";
    b.textContent = "#" + id;
    b.title = alive ? "Follow #" + id : "#" + id + (p && p.died !== null && t >= p.died ? " (died)" : " (not born yet)");
    b.addEventListener("click", () => setFollowed(id, true));
    return b;
  }

  function panel(agents) {
    const t = tickOf(frame);
    el("clock").textContent = when(t);
    const p = people[followed];
    el("who").textContent = "#" + followed;
    if (!p) { el("status").textContent = ""; return; }
    const dead = p.died !== null && t >= p.died;
    const unborn = t < p.born;
    const ageT = dead ? p.died : t;
    const ageDays = Math.max(0, Math.floor((ageT - p.born) / TPD));
    el("status").className = "status" + (dead ? " dead" : "");
    el("status").textContent = unborn ? "not born yet"
      : dead ? `died of ${p.cause.replace("_", " ")} on ${when(p.died).toLowerCase()}`
      : `alive, expected to live about ${Math.round(p.lifespan / TPD)} days`;
    el("age").textContent = `${ageDays} days`;
    el("gen").textContent = p.generation;
    const kidsSoFar = p.children.filter(c => people[c] && people[c].born <= t);
    el("kids").textContent = kidsSoFar.length;

    const me = agents.find(a => a.id === followed);
    const bars = el("bars");
    bars.innerHTML = "";
    for (const [name, key, color] of [["Energy", "energy", "--energy"], ["Water", "water", "--water"], ["Health", "health", "--health"]]) {
      const v = me ? me[key] : 0;
      const row = document.createElement("div");
      row.className = "bar";
      row.innerHTML = `<span>${name}</span><div class="track"><div class="fill" style="width:${v}%;background:var(${color})"></div></div><span>${me ? v + "%" : "–"}</span>`;
      bars.appendChild(row);
    }

    const fam = el("family");
    fam.innerHTML = "";
    if (p.parent >= 0) { const s = document.createElement("span"); s.className = "status"; s.textContent = "parent"; fam.append(s, chip(p.parent, t)); }
    if (kidsSoFar.length) {
      const s = document.createElement("span"); s.className = "status"; s.textContent = "children";
      fam.append(s, ...kidsSoFar.map(c => chip(c, t)));
    }
    if (p.parent < 0 && !kidsSoFar.length) { const s = document.createElement("span"); s.className = "empty"; s.textContent = "a founder, no children yet"; fam.append(s); }

    const story = el("story");
    const seen = p.events.filter(e => e[0] <= t);
    if (story.dataset.key !== followed + ":" + seen.length) {
      story.dataset.key = followed + ":" + seen.length;
      story.innerHTML = "";
      if (!seen.length) story.innerHTML = '<div><time></time><p class="empty">Nothing yet.</p></div>';
      for (let k = seen.length - 1; k >= 0; k--) {
        const [tick, text] = seen[k];
        const row = document.createElement("div");
        const sick = /sick|Died|die \(|Parched|Starving|despite/.test(text);
        row.innerHTML = `<time>${stamp(tick)}</time><p${sick ? ' class="sick"' : ""}></p>`;
        row.querySelector("p").textContent = text;
        story.appendChild(row);
      }
    }

    const list = el("people");
    list.innerHTML = "";
    agents.slice().sort((a, b) => people[b.id].born - people[a.id].born).reverse()
      .forEach(a => list.appendChild(chip(a.id, t)));
  }

  function render() {
    const agents = draw();
    panel(agents);
    scrub.value = frame;
  }

  function setFollowed(id, byHand) {
    followed = id;
    if (byHand) { auto = false; el("auto").checked = false; }
    render();
  }

  function goTo(i) {
    frame = Math.max(0, Math.min(frames.length - 1, i));
    if (auto) followed = frames[frame][0] >= 0 ? frames[frame][0] : followed;
    render();
  }

  // ---- controls ----
  el("play").addEventListener("click", () => {
    if (frame >= frames.length - 1) goTo(0);
    playing = !playing;
    el("play").textContent = playing ? "Pause" : "Play";
    last = performance.now();
  });
  scrub.addEventListener("input", () => goTo(Number(scrub.value)));
  el("auto").addEventListener("change", e => { auto = e.target.checked; goTo(frame); });
  canvas.addEventListener("click", e => {
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
    let best = null, dist = 2.5;
    for (const a of agentsAt(frame)) {
      const d = Math.hypot(a.x + 0.5 - x, a.y + 0.5 - y);
      if (d < dist) { best = a; dist = d; }
    }
    if (best) setFollowed(best.id, true);
  });

  let last = performance.now(), carry = 0;
  function loop(now) {
    if (playing) {
      carry += (now - last) / 1000 * Number(el("speed").value);
      const steps = Math.floor(carry);
      if (steps > 0) {
        carry -= steps;
        goTo(frame + steps);
        if (frame >= frames.length - 1) { playing = false; el("play").textContent = "Play"; }
      }
    }
    last = now;
    requestAnimationFrame(loop);
  }

  // Crisp canvas on high-density screens.
  function fit() {
    const px = Math.round(canvas.getBoundingClientRect().width * (window.devicePixelRatio || 1));
    if (px > 0 && canvas.width !== px) { canvas.width = canvas.height = px; render(); }
  }
  window.addEventListener("resize", fit);

  const years = (frames.length * F / TPD / 365).toFixed(1);
  el("sub").textContent = `A recorded run: seed ${DATA.seed}, ${years} years, lives of about ${DATA.lifespanYears} years. Click anyone on the map to follow their life.`;
  render();
  fit();
  requestAnimationFrame(loop);
})();
</script>
